server {
  listen 80;
  server_name _;
  client_max_body_size 30m;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain;

  # The ART reverse proxy may forward the /plan prefix unchanged.
  # Re-enter location matching so both API and static files use their routes.
  location = /plan {
    return 301 /plan/;
  }

  location /plan/ {
    rewrite ^/plan/(.*)$ /$1 last;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location = /api/production-fact/export.xlsx {
    proxy_pass http://ppp-backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1800s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://ppp-backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
